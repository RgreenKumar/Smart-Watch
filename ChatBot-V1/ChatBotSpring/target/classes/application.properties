spring.datasource.driver-class-name=org.postgresql.Driver
upload.sqlport.directory=data/custom_input.txt
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.encoding=UTF-8
jwt.secret=${JWT_SECRET}
file.upload-dir=uploads/
UserOrigin=${FrontEnd_Url}
AdminOrigin=${Admin_Url}
BackendUrl=${BackEnd_Url}
ragUrl=${RAG_URL:http://localhost:5000}

# Max individual file size (multipart) and total request size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
 
# Chat file upload settings (used by ChatFileUploadController)
# max-size-bytes: 10 MB = 10 * 1024 * 1024
chat.upload.max-size-bytes=10485760
chat.upload.directory=chat-uploads
 
# Static resource mapping — serves files at /chat/files/**
# (the controller handles this; no extra Spring MVC config needed)