name: ott_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+9

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  font_awesome_flutter: ^10.10.0  # Use 10.7.0 or run flutter pub upgrade font_awesome_flutter

  # UI & Media
  cupertino_icons: ^1.0.6

  google_fonts: ^6.2.1
  fluttertoast: ^9.0.0
  transparent_image: ^2.0.1
  cached_network_image: ^3.4.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  dots_indicator: ^4.0.1
  scroll_to_index: ^3.0.1

  # State Management & Utilities
  provider: ^6.1.2
  get: ^4.6.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.3.0
  flutter_dotenv: ^6.0.1

  # Networking & Backend
  http: ^1.2.1
  postgres: ^3.5.12
  web_socket_channel: ^3.0.0

  # Media Player & Audio (Standardized on just_audio)
  video_player: ^2.8.6
  chewie: ^1.10.0
  just_audio: ^0.9.37
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.13
  audio_video_progress_bar: ^2.0.2
  wakelock_plus: ^1.3.2

  # System & Device
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.1.10
  archive: ^3.6.1

  # Payments & Tools
  razorpay_flutter: ^1.3.7
  change_app_package_name: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/media_jungle.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - .env

dependency_overrides:
  font_awesome_flutter:
    git:
      url: https://github.com/fluttercommunity/font_awesome_flutter.git